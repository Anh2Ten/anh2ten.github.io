<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đồng hồ đếm ngược</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      background: #0b0f17;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .guide-box {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 26, 38, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(110, 200, 255, 0.25);
      border-radius: 16px;
      padding: 12px 20px;
      max-width: 92%;
      color: #c8d9f0;
      font-size: 0.82rem;
      line-height: 1.5;
      z-index: 100;
      text-align: center;
      box-shadow: 0 10px 25px -10px rgba(0,0,0,0.7);
      transition: opacity 0.3s;
    }
    .guide-box code {
      background: rgba(0, 0, 0, 0.5);
      padding: 1px 7px;
      border-radius: 6px;
      color: #a8e0ff;
      font-family: monospace;
      font-size: 0.78rem;
    }
    .guide-box .hl { color: #ffd966; font-weight: 600; }
    .guide-box .close-guide {
      position: absolute;
      top: 6px;
      right: 10px;
      cursor: pointer;
      color: #8a9bb5;
      font-size: 1rem;
      line-height: 1;
    }
    .guide-box .close-guide:hover { color: #fff; }

    .timer-container {
      --bg-card: rgba(20, 30, 45, 0.75);
      --border-glow: rgba(120, 180, 255, 0.3);
      --accent: #6ec8ff;
      --text-primary: #f0f6ff;
      --text-dim: #8a9bb5;
      --digit-bg: rgba(0, 0, 0, 0.35);
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: clamp(1.5rem, 4vw, 3.5rem);
      padding: clamp(1.2rem, 4vw, 3rem) clamp(1.5rem, 6vw, 4rem);
      box-shadow: 0 30px 50px -15px rgba(0,0,0,0.8),
                  0 0 0 1px var(--border-glow),
                  0 0 40px -10px var(--accent);
      border: 1px solid rgba(255,255,255,0.06);
      width: fit-content;
      max-width: 100%;
    }
    .timer {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: clamp(0.3rem, 1.5vw, 1.2rem);
      flex-wrap: nowrap;
    }
    .time-block {
      display: flex;
      align-items: baseline;
      gap: clamp(0.1rem, 0.8vw, 0.3rem);
    }
    .digit-group {
      display: flex;
      gap: clamp(0.05rem, 0.4vw, 0.2rem);
      background: var(--digit-bg);
      padding: clamp(0.3rem, 1.2vw, 0.8rem) clamp(0.4rem, 1.5vw, 1rem);
      border-radius: clamp(0.8rem, 2.5vw, 1.5rem);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .digit {
      font-size: clamp(2.5rem, 13vw, 6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      text-shadow: 0 0 15px var(--accent), 0 0 5px rgba(255,255,255,0.5);
      line-height: 1;
      min-width: 0.65em;
      text-align: center;
    }
    .label {
      font-size: clamp(0.6rem, 2.5vw, 1.2rem);
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-left: 0.2em;
      white-space: nowrap;
    }
    .separator {
      font-size: clamp(2rem, 10vw, 5rem);
      font-weight: 300;
      color: var(--accent);
      opacity: 0.75;
      text-shadow: 0 0 12px var(--accent);
      line-height: 1;
    }
    .expired-message {
      font-size: clamp(1.5rem, 7vw, 3.5rem);
      font-weight: 700;
      color: #ffb86b;
      text-shadow: 0 0 20px rgba(255,150,50,0.7);
      letter-spacing: 0.15em;
      text-align: center;
    }

    .customizer-btn {
      position: fixed;
      bottom: 14px;
      right: 14px;
      background: rgba(30, 40, 60, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      color: #d0e2ff;
      border-radius: 60px;
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 20px -5px rgba(0,0,0,0.6);
      z-index: 999;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      opacity: 0.6;
    }
    .customizer-btn:hover {
      opacity: 1;
      background: rgba(50, 70, 100, 0.95);
      border-color: var(--accent);
      color: #fff;
    }

    .customizer-panel {
      position: fixed;
      bottom: 60px;
      right: 14px;
      background: rgba(18, 26, 38, 0.97);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(110, 200, 255, 0.25);
      border-radius: 20px;
      padding: 1.2rem;
      width: 270px;
      box-shadow: 0 30px 50px -10px black, 0 0 30px -5px var(--accent);
      display: none;
      flex-direction: column;
      gap: 0.9rem;
      z-index: 1000;
      font-family: 'Inter', sans-serif;
      color: #eef4ff;
      font-size: 0.85rem;
    }
    .customizer-panel.active { display: flex; }
    .customizer-panel h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #b8d4ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .customizer-panel h3 span {
      font-size: 1.2rem;
      cursor: pointer;
      color: #8a9bb5;
      line-height: 1;
    }
    .customizer-panel h3 span:hover { color: white; }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .control-group label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8a9bb5;
      font-weight: 600;
    }
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-row input[type="color"] {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      padding: 2px;
    }
    .color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
    .color-row input[type="text"] {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 7px 10px;
      color: white;
      font-family: monospace;
      font-size: 0.8rem;
      outline: none;
    }
    .color-row input[type="text"]:focus { border-color: var(--accent); }
    .customizer-panel button {
      background: var(--accent);
      border: none;
      border-radius: 40px;
      padding: 9px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #0b0f17;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .customizer-panel button:hover { filter: brightness(1.15); }
    .customizer-panel .reset-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #b0c4de;
    }

    @media (max-width: 500px) {
      .guide-box { font-size: 0.72rem; padding: 10px 14px; }
      .guide-box .close-guide { top: 4px; right: 8px; }
    }
  </style>
</head>
<body>

  <div class="guide-box" id="guideBox">
    <span class="close-guide" id="closeGuide">✕</span>
    <strong style="color:#a8d0ff;">📖 Hướng dẫn:</strong>
    Thêm <code>?time=</code> vào URL.
    VD: <code>?time=5</code> (5s),
    <code>?time=2:30</code> (2p30s),
    <code>?time=1:15:30</code> (1h15p30s).
    Không có → 60s. <span class="hl">🎨</span> ở góc dưới để đổi màu.
  </div>

  <div class="timer-container" id="timerContainer">
    <div class="timer" id="timerDisplay">
      <div class="time-block">
        <div class="digit-group">
          <div class="digit" id="hoursTens">0</div>
          <div class="digit" id="hoursOnes">0</div>
        </div>
        <span class="label">Giờ</span>
      </div>
      <span class="separator">:</span>
      <div class="time-block">
        <div class="digit-group">
          <div class="digit" id="minutesTens">0</div>
          <div class="digit" id="minutesOnes">0</div>
        </div>
        <span class="label">Phút</span>
      </div>
      <span class="separator">:</span>
      <div class="time-block">
        <div class="digit-group">
          <div class="digit" id="secondsTens">0</div>
          <div class="digit" id="secondsOnes">0</div>
        </div>
        <span class="label">Giây</span>
      </div>
    </div>
    <div id="expiredBox" style="display:none;" class="expired-message">⏰ HẾT GIỜ</div>
  </div>

  <button class="customizer-btn" id="openCustomizer">🎨</button>

  <div class="customizer-panel" id="customizerPanel">
    <h3>🎛️ Tùy chỉnh <span id="closeCustomizer">✕</span></h3>
    <div class="control-group">
      <label>Màu nền</label>
      <div class="color-row">
        <input type="color" id="bgColor" value="#141e2d">
        <input type="text" id="bgColorText" value="#141e2d">
      </div>
    </div>
    <div class="control-group">
      <label>Màu chữ số</label>
      <div class="color-row">
        <input type="color" id="digitColor" value="#f0f6ff">
        <input type="text" id="digitColorText" value="#f0f6ff">
      </div>
    </div>
    <div class="control-group">
      <label>Màu nhấn</label>
      <div class="color-row">
        <input type="color" id="accentColor" value="#6ec8ff">
        <input type="text" id="accentColorText" value="#6ec8ff">
      </div>
    </div>
    <div class="control-group">
      <label>Màu nhãn</label>
      <div class="color-row">
        <input type="color" id="labelColor" value="#8a9bb5">
        <input type="text" id="labelColorText" value="#8a9bb5">
      </div>
    </div>
    <button id="applyCustom">Áp dụng</button>
    <button class="reset-btn" id="resetCustom">Mặc định</button>
  </div>

  <script>
    (function() {
      const timerDisplay = document.getElementById('timerDisplay');
      const expiredBox = document.getElementById('expiredBox');
      const hoursTens = document.getElementById('hoursTens');
      const hoursOnes = document.getElementById('hoursOnes');
      const minutesTens = document.getElementById('minutesTens');
      const minutesOnes = document.getElementById('minutesOnes');
      const secondsTens = document.getElementById('secondsTens');
      const secondsOnes = document.getElementById('secondsOnes');

      let timerInterval = null;

      function parseTimeParam() {
        const timeParam = new URLSearchParams(window.location.search).get('time');
        if (!timeParam) return 60;
        let seconds = 0;
        if (timeParam.includes(':')) {
          const p = timeParam.split(':').map(Number);
          if (p.length === 3) seconds = p[0]*3600 + p[1]*60 + p[2];
          else if (p.length === 2) seconds = p[0]*60 + p[1];
          else seconds = p[0];
        } else seconds = Number(timeParam);
        if (isNaN(seconds) || seconds <= 0) seconds = 60;
        return Math.floor(seconds);
      }

      function updateDisplay(sec) {
        if (sec < 0) sec = 0;
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        hoursTens.textContent = Math.floor(h / 10);
        hoursOnes.textContent = h % 10;
        minutesTens.textContent = Math.floor(m / 10);
        minutesOnes.textContent = m % 10;
        secondsTens.textContent = Math.floor(s / 10);
        secondsOnes.textContent = s % 10;
      }

      function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      }

      function startTimer(seconds) {
        stopTimer();
        timerDisplay.style.display = 'flex';
        expiredBox.style.display = 'none';
        updateDisplay(seconds);
        if (seconds <= 0) {
          timerDisplay.style.display = 'none';
          expiredBox.style.display = 'block';
          return;
        }
        const startTime = Date.now();
        const initial = seconds;
        timerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - startTime) / 1000);
          const remaining = initial - elapsed;
          if (remaining <= 0) {
            updateDisplay(0);
            stopTimer();
            timerDisplay.style.display = 'none';
            expiredBox.style.display = 'block';
          } else {
            updateDisplay(remaining);
          }
        }, 200);
      }

      startTimer(parseTimeParam());

      function applyColors(bg, digit, accent, label) {
        const c = document.getElementById('timerContainer');
        c.style.setProperty('--bg-card', bg + 'cc');
        c.style.setProperty('--accent', accent);
        c.style.setProperty('--text-primary', digit);
        c.style.setProperty('--text-dim', label);
        c.style.setProperty('--border-glow', accent + '55');
        document.querySelectorAll('.separator').forEach(el => {
          el.style.color = accent;
          el.style.textShadow = `0 0 12px ${accent}`;
        });
        document.querySelectorAll('.digit').forEach(el => {
          el.style.color = digit;
          el.style.textShadow = `0 0 15px ${accent}, 0 0 5px rgba(255,255,255,0.5)`;
        });
        document.querySelectorAll('.label').forEach(el => el.style.color = label);
        const exp = document.querySelector('.expired-message');
        if (exp) { exp.style.color = accent; exp.style.textShadow = `0 0 20px ${accent}cc`; }
      }

      function loadColors() {
        const saved = localStorage.getItem('timerColors');
        if (saved) {
          try {
            const c = JSON.parse(saved);
            applyColors(c.bg, c.digit, c.accent, c.label);
            ['bg','digit','accent','label'].forEach(k => {
              document.getElementById(k + 'Color').value = c[k];
              document.getElementById(k + 'ColorText').value = c[k];
            });
            return;
          } catch(e) {}
        }
        applyColors('#141e2d', '#f0f6ff', '#6ec8ff', '#8a9bb5');
      }
      loadColors();

      const panel = document.getElementById('customizerPanel');
      document.getElementById('openCustomizer').addEventListener('click', () => panel.classList.toggle('active'));
      document.getElementById('closeCustomizer').addEventListener('click', () => panel.classList.remove('active'));

      ['bg','digit','accent','label'].forEach(k => {
        const ci = document.getElementById(k + 'Color');
        const ti = document.getElementById(k + 'ColorText');
        ci.addEventListener('input', () => ti.value = ci.value);
        ti.addEventListener('input', () => {
          if (/^#[0-9a-fA-F]{6}$/.test(ti.value.trim())) ci.value = ti.value.trim();
        });
      });

      document.getElementById('applyCustom').addEventListener('click', () => {
        const bg = document.getElementById('bgColor').value;
        const digit = document.getElementById('digitColor').value;
        const accent = document.getElementById('accentColor').value;
        const label = document.getElementById('labelColor').value;
        applyColors(bg, digit, accent, label);
        localStorage.setItem('timerColors', JSON.stringify({bg, digit, accent, label}));
      });

      document.getElementById('resetCustom').addEventListener('click', () => {
        const d = {bg:'#141e2d', digit:'#f0f6ff', accent:'#6ec8ff', label:'#8a9bb5'};
        Object.keys(d).forEach(k => {
          document.getElementById(k + 'Color').value = d[k];
          document.getElementById(k + 'ColorText').value = d[k];
        });
        applyColors(d.bg, d.digit, d.accent, d.label);
        localStorage.removeItem('timerColors');
      });

      document.addEventListener('click', (e) => {
        if (panel.classList.contains('active') &&
            !panel.contains(e.target) &&
            e.target.id !== 'openCustomizer') {
          panel.classList.remove('active');
        }
      });

      const guide = document.getElementById('guideBox');
      document.getElementById('closeGuide').addEventListener('click', () => guide.style.display = 'none');
      setTimeout(() => { guide.style.opacity = '0.35'; }, 6000);
      guide.addEventListener('mouseenter', () => guide.style.opacity = '1');
      guide.addEventListener('mouseleave', () => guide.style.opacity = '0.35');
    })();
  </script>
</body>
</html>
